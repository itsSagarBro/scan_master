name: scan_master
description: A feature-rich barcode and QR code scanner and generator app built with Flutter.
version: 1.0.0+1
publish_to: "none"

homepage: https://github.com/itsSagarBro/scan_master
repository: https://github.com/itsSagarBro/scan_master
issue_tracker: https://github.com/itsSagarBro/scan_master/issues

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  auto_size_text: ^3.0.0
  flutter_slidable: ^4.0.3

  # Routing & State Management
  go_router: ^18.1.0
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1

  # Scanning & Barcodes
  mobile_scanner: ^7.4.2
  barcode_widget: ^2.0.4
  pretty_qr_code: ^3.3.0

  # Local Storage
  hive_flutter: ^1.1.0

  # System, Media & Device Features
  url_launcher: ^6.2.1
  share_plus: ^13.3.1
  wifi_iot: ^0.4.0
  screenshot: ^3.0.0
  gal: ^2.3.0
  in_app_review: ^2.0.9

  # Utilities
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/play_store_512.png